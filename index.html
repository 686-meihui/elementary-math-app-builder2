<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>借位減法練習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：標題＋單元／頁籤 → 說明與紀錄 → 黏在上方的計時列 → 題卡格狀排列 → 結果區 */
:root {
  --bg: #f2f6f4;
  --surface: #ffffff;
  --tint: #e2efeb;
  --ink: #1b2a28;
  --muted: #566866;
  --line: #d3dfdb;
  --accent: #0e7a6e;
  --accent-ink: #ffffff;
  --good: #17803d;
  --bad: #b93c12;
  --warn: #b45309;
  --gold-a: #ffd54a;
  --gold-b: #e39a0b;
  --star: #fff6cf;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a18; --surface: #15231f; --tint: #1b302b; --ink: #e6f0ed; --muted: #9fb5b0;
    --line: #2a3f3a; --accent: #3cc9b5; --accent-ink: #06201c; --good: #5dd88a; --bad: #ff9a6b;
    --warn: #f5b45a; --gold-a: #ffe07a; --gold-b: #f0a81c; --star: #fff6cf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a18; --surface: #15231f; --tint: #1b302b; --ink: #e6f0ed; --muted: #9fb5b0;
  --line: #2a3f3a; --accent: #3cc9b5; --accent-ink: #06201c; --good: #5dd88a; --bad: #ff9a6b;
  --warn: #f5b45a; --gold-a: #ffe07a; --gold-b: #f0a81c; --star: #fff6cf;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 黏住的計時列上方，補上安全區的底色 */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px; }
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.kicker { margin: 0; font-size: .85rem; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 900; line-height: 1.25; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tab, .chip {
  min-height: 44px; padding: 6px 16px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 1rem; font-weight: 700; text-align: left; line-height: 1.25;
}
.tab small { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"], .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] small { color: inherit; opacity: .85; }
.tab:disabled { opacity: .55; cursor: not-allowed; }
.tab[aria-selected="true"]:disabled { opacity: 1; cursor: default; }

.info { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; margin-bottom: 12px; }
.desc { margin: 0; flex: 1 1 260px; min-width: 0; color: var(--muted); }
.stats { display: flex; gap: 8px; margin: 0; flex-wrap: wrap; }
.stats div { background: var(--tint); border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 84px; }
.stats dt { font-size: .75rem; color: var(--muted); }
.stats dd { margin: 0; font-weight: 900; font-size: 1.15rem; font-variant-numeric: tabular-nums; }

.clockrow {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 12px;
  background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
}
.clock { font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.meter { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--tint); overflow: hidden; }
#meterFill { height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
.meter.over #meterFill { background: var(--warn); }
.note { grid-column: 1 / -1; margin: 0; font-size: .9rem; color: var(--muted); }
.hint { margin: 0 0 8px; min-height: 1.4em; color: var(--bad); font-weight: 700; }
.locknote { margin: 0 0 10px; color: var(--muted); }
.locknote[hidden] { display: none; }

.btn {
  min-height: 44px; padding: 8px 22px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--accent); background: transparent; color: var(--accent);
  font-size: 1.05rem; font-weight: 700;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.q {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0;
  padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 2px solid var(--line);
}
.no { width: 100%; font-size: .75rem; color: var(--muted); }
.expr { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid.locked .expr { filter: blur(9px); user-select: none; }
.ans {
  width: 3.6em; min-height: 42px; padding: 2px 6px; text-align: center; font-size: 1.3rem; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 8px;
}
.ans:disabled { opacity: .7; }
.ans { cursor: pointer; caret-color: transparent; }
.q { scroll-margin-top: 150px; scroll-margin-bottom: calc(var(--dock-h, 0px) + 16px); cursor: pointer; }
.q.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.q.cur .ans { border-color: var(--accent); background: var(--surface); }

/* 內建數字鍵盤：寬螢幕（平板橫放、電腦）放在題目右側，跟著捲動；窄螢幕（手機、平板直放）貼在畫面下方 */
.work { display: flex; gap: 16px; align-items: flex-start; }
.work .grid { flex: 1; min-width: 0; }
.pad {
  flex: none; width: 250px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 140px);
  padding: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
}
.key {
  min-height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  font-size: 1.7rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.key:active { background: var(--tint); }
.key.kb, .key.kn { font-size: 1.05rem; }
.key.kn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 819px) {
  .work { display: block; }
  .pad {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; z-index: 6;
    grid-template-columns: repeat(6, 1fr); border-width: 2px 0 0; border-radius: 14px 14px 0 0;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -4px 16px rgba(0, 0, 0, .15);
  }
  .key { min-height: 52px; }
  .k0 { order: 1; } .kb { order: 2; } .kn { order: 3; }
  body.has-pad .wrap { padding-bottom: calc(var(--dock-h, 160px) + 24px); }
}
.fb { width: 100%; font-size: .9rem; font-weight: 700; }
.q.ok { border-color: var(--good); }
.q.ok .fb { color: var(--good); }
.q.ng { border-color: var(--bad); }
.q.ng .fb { color: var(--bad); }

.result {
  position: relative; overflow: hidden; margin-top: 20px; padding: 22px 16px 20px; text-align: center;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
}
.result h2 { margin: 6px 0; font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 900; text-wrap: balance; }
.result p { margin: 4px auto 0; max-width: 34em; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
.trophy { width: min(58vw, 230px); height: auto; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.burst { position: absolute; inset: 0; pointer-events: none; }
.burst i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2.6s ease-in both; }

@keyframes pop { from { transform: scale(.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fall { from { transform: translateY(0) rotate(0); opacity: 1; } to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .trophy { animation: none; }
  .burst { display: none; }
  #meterFill { transition: none; }
}

/* 獎勵系統：標題列、獎勵說明、分級計時條、金銀銅獎杯、我的紀錄（月曆與清單） */
:root {
  --silver-a: #f1f5f6; --silver-b: #8c9ea3;
  --bronze-a: #f4bf8f; --bronze-b: #b25d1b;
}
.toprow { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.titlebox { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.topacts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.streak { margin: 2px 0 0; font-weight: 700; color: var(--accent); }
.bank {
  min-height: 44px; padding: 6px 16px; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 700;
  border: 2px solid var(--gold-b); background: var(--gold-a); color: #3d2a00;
}
.bank b { font-weight: 900; font-variant-numeric: tabular-nums; }
.bank:disabled { opacity: .55; cursor: not-allowed; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.tiers { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tiers li {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; font-size: .95rem; line-height: 1.3;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px;
}
.tiers li.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.medal { width: 22px; height: 22px; flex: none; border-radius: 50%; background: linear-gradient(145deg, var(--m-a), var(--m-b)); }
.t0 { --m-a: var(--gold-a); --m-b: var(--gold-b); }
.t1 { --m-a: var(--silver-a); --m-b: var(--silver-b); }
.t2 { --m-a: var(--bronze-a); --m-b: var(--bronze-b); }

/* 計時條：整條代表最寬鬆的時間門檻，顏色跟著目前可得的獎勵變化，刻度標出每一級的截止點 */
.meter { position: relative; }
.meter .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .45; }
.meter.t0 #meterFill { background: var(--gold-b); }
.meter.t1 #meterFill { background: var(--silver-b); }
.meter.t2 #meterFill { background: var(--bronze-b); }
.meter.over #meterFill { background: var(--bad); }

.trophy .tg-a { stop-color: var(--m-a); }
.trophy .tg-b { stop-color: var(--m-b); }
.result h2 small { font-size: .6em; font-weight: 700; }
.result .big { font-size: 1.15rem; }
.result .cheer { font-weight: 700; color: var(--accent); }
.autonote { margin: 12px 0 0; font-weight: 700; }
.linkbtn {
  min-height: 36px; padding: 2px 12px; margin-left: 6px; border-radius: 8px; cursor: pointer; font-size: .95rem; font-weight: 700;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}

/* 我的紀錄 */
.logwrap { gap: 14px; }
.logtitle { margin: 0; flex: 1; font-size: 1.4rem; font-weight: 900; }
.logh { margin: 0 0 6px; font-size: 1.05rem; }
.logstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 0; }
.logstats div { background: var(--tint); border-radius: 12px; padding: 8px 12px; text-align: center; }
.logstats dt { font-size: .78rem; color: var(--muted); }
.logstats dd { margin: 0; font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.logstats dd small { font-size: .8rem; font-weight: 700; margin-left: 2px; }

.cal { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 1.1rem; }
.calbtn {
  min-width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg);
  color: var(--ink); font-size: 1.5rem; line-height: 1; cursor: pointer;
}
.calbtn:disabled { opacity: .4; cursor: not-allowed; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cw { font-size: .8rem; color: var(--muted); }
.cd {
  position: relative; aspect-ratio: 1; max-height: 58px; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-weight: 700; background: var(--bg); font-variant-numeric: tabular-nums;
}
.cd.try { background: var(--tint); box-shadow: inset 0 0 0 2px var(--accent); }
.cd.pass { background: var(--gold-a); color: #3d2a00; box-shadow: inset 0 0 0 2px var(--gold-b); }
.cd.pass::after { content: "★"; position: absolute; top: 1px; right: 4px; font-size: .7rem; color: #a05a00; }
.cd.today { outline: 3px solid var(--ink); outline-offset: 1px; }
.callegend { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; }
.sw-try { background: var(--tint); box-shadow: inset 0 0 0 2px var(--accent); }
.sw-pass { background: var(--gold-a); box-shadow: inset 0 0 0 2px var(--gold-b); }
.sw-today { background: var(--bg); outline: 2px solid var(--ink); }

.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.loglist li {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.loglist .ld { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.loglist .lw { font-weight: 700; min-width: 0; }
.loglist .lr { font-size: .9rem; font-weight: 700; text-align: right; }
.loglist .lr.pass { color: var(--good); }
.loglist .empty { display: block; color: var(--muted); text-align: center; }
.logfoot { display: flex; justify-content: center; padding-bottom: 12px; }
@media (max-width: 520px) {
  .loglist li { grid-template-columns: 1fr auto; }
  .loglist .ld { grid-column: 1 / -1; }
}

/* 獎勵遊戲「糖果消消樂」：全螢幕遊戲層、HUD、盤面、糖果、特殊糖果、動畫 */
body.playing { overflow: hidden; }
.overlay {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.gwrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.gbar { display: flex; align-items: center; gap: 12px; }
.gtimebox { display: flex; flex-direction: column; line-height: 1.1; min-width: 86px; }
.hl { font-size: .75rem; color: var(--muted); }
.gtime { font-size: 1.9rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.gtime.low { color: var(--bad); }
.gmeter { flex: 1; height: 10px; border-radius: 99px; background: var(--tint); overflow: hidden; }
#gMeter { height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }

.ghud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.hud-item { background: var(--tint); border-radius: 10px; padding: 4px 10px; text-align: center; min-width: 60px; }
.hud-item b { display: block; font-size: 1.3rem; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
.hud-item.low b { color: var(--bad); }
.hud-goal { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; line-height: 1.3; min-width: 0; }
.gprog { height: 8px; border-radius: 99px; background: var(--tint); overflow: hidden; }
#gProg { height: 100%; width: 0; background: var(--good); transition: width .3s ease; }
.ghelp { margin: 4px 0 0; font-size: .9rem; color: var(--muted); }

/* 盤面：正方形，寬度受螢幕高度限制，所以平板橫放也看得到整個盤面 */
.boardwrap {
  position: relative; aspect-ratio: 1; margin: 0 auto;
  width: min(100%, calc(100vh - 270px), 560px);
  width: min(100%, calc(100dvh - 270px), 560px);
}
.board {
  position: absolute; inset: 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--line);
  background: var(--tint); touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer;
}
.gcells {
  position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  background: conic-gradient(var(--surface) 25%, var(--tint) 0 50%, var(--surface) 0 75%, var(--tint) 0) 0 0 / 25% 25%;
}
.gcell[data-j="1"] { background: rgba(90, 175, 255, .5); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .85); }
.gcell[data-j="2"] { background: rgba(40, 105, 230, .75); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .9), inset 0 0 0 5px rgba(40, 105, 230, .9), inset 0 0 0 7px rgba(255, 255, 255, .7); }
.gtiles { position: absolute; inset: 0; }

/* 糖果：顏色加形狀，不靠顏色也分得出來 */
.tile {
  position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%;
  transition: transform .2s ease; will-change: transform; pointer-events: none;
}
/* 糖果本體縮進 9%（用 inset 而不是 padding：百分比 padding 是以整個盤面的寬度計算，會把糖果擠沒） */
.shape { display: block; position: absolute; inset: 9%; }
[data-t] > .shape {
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 9%, rgba(255, 255, 255, 0) 24%), linear-gradient(150deg, var(--c1), var(--c2));
}
[data-t="0"] { --c1: #ff8a8d; --c2: #d92b3a; } [data-t="0"] > .shape { border-radius: 50%; }
[data-t="1"] { --c1: #ffbb6a; --c2: #e8710a; } [data-t="1"] > .shape { border-radius: 26%; }
[data-t="2"] { --c1: #ffe96e; --c2: #e0b000; } [data-t="2"] > .shape { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
[data-t="3"] { --c1: #84e393; --c2: #1f9d4a; } [data-t="3"] > .shape { clip-path: polygon(50% 4%, 98% 92%, 2% 92%); }
[data-t="4"] { --c1: #84b8ff; --c2: #2563eb; } [data-t="4"] > .shape { clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
[data-t="5"] { --c1: #d4a8ff; --c2: #7c3aed; } [data-t="5"] > .shape { clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 36%); }

/* 特殊糖果 */
[data-s="1"] > .shape {   /* 消整行：橫條紋 */
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .92) 0 3px, rgba(255, 255, 255, 0) 3px 9px),
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 9%, rgba(255, 255, 255, 0) 24%), linear-gradient(150deg, var(--c1), var(--c2));
}
[data-s="2"] > .shape {   /* 消整列：直條紋 */
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .92) 0 3px, rgba(255, 255, 255, 0) 3px 9px),
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 9%, rgba(255, 255, 255, 0) 24%), linear-gradient(150deg, var(--c1), var(--c2));
}
[data-s="3"] > .shape {   /* 爆炸：白色圓環 */
  background: radial-gradient(circle, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .95) 32% 46%, rgba(255, 255, 255, 0) 48%),
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 9%, rgba(255, 255, 255, 0) 24%), linear-gradient(150deg, var(--c1), var(--c2));
}
.tile[data-s="3"], .tile[data-s="4"] { animation: gglow 1s ease-in-out infinite alternate; }
[data-t="-1"] > .shape {  /* 彩虹糖 */
  border-radius: 50%; clip-path: none;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95) 0 12%, rgba(255, 255, 255, 0) 30%),
    conic-gradient(#ff4d4f, #ffb020, #ffe14d, #34c759, #3b82f6, #a855f7, #ff4d4f);
}

.tile.sel::before { content: ""; position: absolute; inset: 4%; border: 3px solid var(--ink); border-radius: 30%; }
.tile.sel > .shape { transform: scale(1.12); }
.tile.hint > .shape { animation: ghint .7s ease-in-out infinite alternate; }
.tile.pop > .shape { animation: gpop .24s ease-in forwards; }
.tile.born > .shape { animation: gborn .5s ease-out; }
.mini { display: inline-block; position: relative; width: 30px; height: 30px; flex: none; }
.mini > .shape { inset: 2px; }

.gtoast {
  position: absolute; left: 50%; top: 6%; z-index: 3; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 6px 16px; border-radius: 99px; font-weight: 700;
}
.gtoast.show { animation: gtoast 1.1s ease-out both; }
.gpanel {
  position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 20px; text-align: center; border-radius: 14px; background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
}
.gpanel[hidden] { display: none; }
.gpanel h3 { margin: 0; font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 900; text-wrap: balance; }
.gpanel p { margin: 0; max-width: 24em; }
.gstars { display: flex; gap: 6px; }
.gstars span { font-size: 2.4rem; line-height: 1; color: var(--line); }
.gstars span.on { color: var(--gold-b); }
.gpbtn { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }

@keyframes gpop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
@keyframes gborn { from { transform: scale(1.7); } to { transform: scale(1); } }
@keyframes ghint { from { transform: scale(1); } to { transform: scale(1.18); } }
@keyframes gglow { from { filter: drop-shadow(0 0 1px #fff); } to { filter: drop-shadow(0 0 7px #fff); } }
@keyframes gtoast { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile[data-s="3"], .tile[data-s="4"], .tile.hint > .shape, .tile.born > .shape { animation: none; }
  .tile.pop > .shape { animation: none; opacity: 0; }
  .gtoast.show { animation: none; }
  #gMeter, #gProg { transition: none; }
}

</style>

<noscript>這個練習需要開啟 JavaScript。</noscript>
<script>
/* core.js — 題目引擎核心（純邏輯、無 DOM，可直接在 Node 內驗證）
 *
 * 單元模組用 MathCore.register({...}) 登錄；介面（ui.js）與驗證（verify.js）
 * 都只透過 MathCore.buildPage() 取得題目，所以兩邊看到的永遠是同一套出題程式。
 */
(function (g) {
  'use strict';

  var modules = [];

  // 運算符號表：題目只存 a、op、b，答案與顯示文字由這裡統一計算，
  // 因此單元模組不可能寫出「題目與答案不一致」的題目。
  var ops = {
    '-': { sym: '−', fn: function (a, b) { return a - b; } },
    '+': { sym: '+', fn: function (a, b) { return a + b; } },
    '*': { sym: '×', fn: function (a, b) { return a * b; } },
    '/': { sym: '÷', fn: function (a, b) { return a / b; } }
  };

  // 可指定種子的亂數，驗證時可重現、可大量抽樣
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  var kit = {
    mulberry32: mulberry32,
    int: function (rng, min, max) { return min + Math.floor(rng() * (max - min + 1)); },
    pick: function (rng, arr) { return arr[Math.floor(rng() * arr.length)]; },
    shuffle: function (rng, arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(rng() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    digits: function (n) { return { tens: Math.floor(n / 10) % 10, ones: n % 10 }; },
    // 產生 count 題不重複的題目。make(i) 回傳 {a, op, b, tag?}，回傳 null 代表這次不採用。
    unique: function (count, make) {
      var out = [], seen = {}, tries = 0, limit = count * 500;
      while (out.length < count) {
        if (++tries > limit) throw new Error('符合條件的不重複題目不足 ' + count + ' 題，請放寬條件');
        var q = make(out.length);
        if (!q) continue;
        var k = q.a + q.op + q.b;
        if (seen[k]) continue;
        seen[k] = 1;
        out.push(q);
      }
      return out;
    }
  };

  function register(mod) {
    if (!mod || !mod.id || !mod.title || !mod.pages || !mod.pages.length) {
      throw new Error('單元模組必須有 id、title、pages');
    }
    mod.pages.forEach(function (p) {
      if (!p.id || !p.title || !p.count || typeof p.generate !== 'function' || typeof p.validate !== 'function') {
        throw new Error(mod.id + ' 的頁面必須有 id、title、count、generate()、validate()');
      }
      if (!p.rewards) p.rewards = defaultRewards.map(function (r) { return { limit: r.limit, minutes: r.minutes, medal: r.medal }; });
      checkRewards(mod.id + ' ' + p.id, p.rewards);
      p.timeLimit = p.rewards[p.rewards.length - 1].limit;   // 最寬鬆的門檻，計時條以它為滿格
    });
    modules.push(mod);
  }

  // 獎勵分級（全對才有）：limit 秒內交卷，可玩 minutes 分鐘遊戲。越快越多，所以 limit 由小到大、minutes 由大到小。
  // 頁面可用 rewards 欄位自訂，沒寫就用預設（金 100 秒 15 分鐘、銀 150 秒 8 分鐘、銅 200 秒 5 分鐘）。
  var defaultRewards = [
    { limit: 100, minutes: 15, medal: '金' },
    { limit: 150, minutes: 8, medal: '銀' },
    { limit: 200, minutes: 5, medal: '銅' }
  ];

  function checkRewards(where, rw) {
    if (!Array.isArray(rw) || !rw.length) throw new Error(where + ' 的 rewards 必須是非空陣列');
    rw.forEach(function (r, i) {
      if (!(r.limit > 0) || !(r.minutes > 0) || !r.medal) throw new Error(where + ' 的 rewards[' + i + '] 需要 limit、minutes、medal');
      if (i > 0 && !(r.limit > rw[i - 1].limit && r.minutes < rw[i - 1].minutes)) {
        throw new Error(where + ' 的 rewards 要由快到慢排列：limit 越來越大、minutes 越來越小');
      }
    });
  }

  // 回傳拿到第幾級獎勵（0 = 最高級），沒有達標回傳 -1。沒有全對一律沒有獎勵。
  function rewardFor(page, allCorrect, seconds) {
    if (!allCorrect) return -1;
    for (var i = 0; i < page.rewards.length; i++) if (seconds <= page.rewards[i].limit) return i;
    return -1;
  }

  function finish(q) {
    var o = ops[q.op];
    return { a: q.a, op: q.op, b: q.b, tag: q.tag || '', text: q.a + ' ' + o.sym + ' ' + q.b, answer: o.fn(q.a, q.b) };
  }

  function buildPage(mod, page, seed) {
    var rng = mulberry32(seed);
    return page.generate(rng, kit).map(finish);
  }

  g.MathCore = {
    modules: modules, ops: ops, kit: kit, register: register, buildPage: buildPage, finish: finish,
    defaultRewards: defaultRewards, rewardFor: rewardFor
  };
})(globalThis);

/* store.js — 練習紀錄與遊戲時間存摺（純邏輯、無 DOM，可在 Node 內測試）
 *
 * 所有資料存在這台裝置的瀏覽器（localStorage），換裝置或清除瀏覽資料就會歸零；
 * localStorage 不能用時（無痕模式等）退回記憶體，頁面關掉就消失，但畫面仍能正常運作。
 *
 * 資料結構（key = mathpractice:v2）：
 *   log  每次交卷一筆：{ t 時間戳記, d 'YYYY-MM-DD'（本機日期）, m 單元 id, p 頁面 id,
 *                        sec 用時（秒）, ok 答對題數, n 題數, pass 是否達標, medal 獎勵級別（0 最高、-1 沒有）, mins 獲得的遊戲分鐘 }
 *   bank 還沒玩完的遊戲時間（秒）
 */
(function (g) {
  'use strict';
  var KEY = 'mathpractice:v2', MAX_LOG = 1000;
  var data = { log: [], bank: 0, level: 1 };
  var store = { now: function () { return Date.now(); } };   // 測試時可替換

  function clean(v) {
    var o = { log: [], bank: 0, level: 1 };
    if (v && typeof v === 'object') {
      if (Array.isArray(v.log)) o.log = v.log.filter(function (e) { return e && typeof e.t === 'number' && typeof e.d === 'string'; });
      o.bank = Math.max(0, Number(v.bank) || 0);
      o.level = Math.max(1, Math.round(Number(v.level)) || 1);
    }
    return o;
  }
  // 重新讀一次儲存的資料（另一個分頁可能剛寫過）；讀不到就沿用記憶體裡的
  function refresh() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) data = clean(JSON.parse(raw));
    } catch (e) { /* 沿用記憶體 */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 只保留在記憶體 */ }
  }

  function two(n) { return (n < 10 ? '0' : '') + n; }
  function dayStr(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  store.dayOf = function (ms) { return dayStr(new Date(ms)); };
  store.today = function () { return store.dayOf(store.now()); };

  /* ---------- 寫入 ---------- */
  // info: { m, p, sec, ok, n, medal（-1 或 0,1,2…）, minutes }
  store.addAttempt = function (info) {
    refresh();
    var t = store.now();
    var e = {
      t: t, d: store.dayOf(t), m: info.m, p: info.p, sec: Math.round(info.sec * 10) / 10,
      ok: info.ok, n: info.n, pass: info.medal >= 0, medal: info.medal, mins: info.medal >= 0 ? info.minutes : 0
    };
    data.log.push(e);
    if (data.log.length > MAX_LOG) data.log = data.log.slice(-MAX_LOG);
    if (e.pass) data.bank += e.mins * 60;
    save();
    return e;
  };

  /* ---------- 查詢 ---------- */
  store.pageStats = function (m, p) {
    refresh();
    var s = { attempts: 0, passes: 0, best: null };
    data.log.forEach(function (e) {
      if (e.m !== m || e.p !== p) return;
      s.attempts++;
      if (e.pass) s.passes++;
      if (e.ok === e.n && (s.best === null || e.sec < s.best)) s.best = e.sec;   // 最佳時間：全對的紀錄裡最快的
    });
    return s;
  };

  // 有練習的日子 → { 'YYYY-MM-DD': { tries, passes } }
  store.byDay = function () {
    refresh();
    var map = {};
    data.log.forEach(function (e) {
      var x = map[e.d] || (map[e.d] = { tries: 0, passes: 0 });
      x.tries++;
      if (e.pass) x.passes++;
    });
    return map;
  };

  // 連續練習天數。今天還沒練習時從昨天往回算，所以早上打開不會看到「斷掉了」。
  store.streak = function () {
    var days = store.byDay();
    var d = new Date(store.now());
    d.setHours(12, 0, 0, 0);                    // 避開夏令時間等邊界
    if (!days[dayStr(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (days[dayStr(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };

  store.totals = function () {
    var days = store.byDay(), today = days[store.today()] || { tries: 0, passes: 0 };
    var passes = 0;
    data.log.forEach(function (e) { if (e.pass) passes++; });
    return {
      attempts: data.log.length, passes: passes, days: Object.keys(days).length,
      streak: store.streak(), todayTries: today.tries, todayPasses: today.passes
    };
  };

  store.recent = function (n) {
    refresh();
    return data.log.slice(-n).reverse();
  };

  /* ---------- 遊戲時間存摺 ---------- */
  store.getBank = function () { refresh(); return data.bank; };
  store.setBank = function (seconds) {
    refresh();
    data.bank = Math.max(0, Math.round(seconds));
    save();
  };

  // 遊戲進度：下一次進遊戲從哪一關開始（越玩越難）
  store.getLevel = function () { refresh(); return data.level || 1; };
  store.setLevel = function (n) { refresh(); data.level = Math.max(1, Math.round(n)); save(); };

  store.clearAll = function () { data = { log: [], bank: 0, level: 1 }; save(); };

  g.MathStore = store;
})(globalThis);

/* game.js — 獎勵遊戲「糖果消消樂」
 *
 * 分成兩層：
 *   MathGame.logic  純規則（盤面、消除、特殊糖果、關卡、計分），沒有 DOM，可在 Node 內用機器人測難度。
 *   介面層          全螢幕遊戲層、倒數計時、觸控／滑鼠操作、動畫。
 *
 * 玩法：點一顆糖果再點旁邊的糖果（或直接滑動）交換位置，連成 3 顆以上就消除。
 *   連 4 顆 → 直線糖（消掉整行或整列）　連 5 顆 → 彩虹糖（和任何糖果交換，消掉該顏色全部）
 *   L 型或 T 型 → 爆炸糖（消掉周圍 3×3）
 * 難度：每關有目標（分數／清除果凍／收集某種糖果）和步數上限，用完步數沒達標要重來；過關後下一關更難。
 */
(function (g) {
  'use strict';

  /* =====================================================================
   * 一、純規則
   * ===================================================================== */
  var SIZE = 8;
  var nextId = 1;

  // 被消除的糖果裡若有特殊糖果，會連鎖引爆

  // 難度參數 [起始值, 每升一階增加, 起始步數]；用機器人實測調整過

  function newState(def, rng) {

  var LG = logic;
  var NAMES = ['紅色圓形糖', '橘色方形糖', '黃色菱形糖', '綠色三角糖', '藍色六角糖', '紫色星形糖'];

  var O = null;            // 呼叫者傳入的設定

  function buildBoard() {

  /* ---------- 提示：玩家發呆一陣子，閃出一個可以走的步 ---------- */

  }

/* 單元模組：兩位數借位減法（二年級）
 *
 * 規則解讀（改規則請同步更新 references/module-api.md）：
 *   「個位差 d」＝ 減數個位比被減數個位大 d，個位不夠減，一定要借位；差的個位數是 10 − d。
 *   例：d = 1 → 52 − 43 = 9、82 − 43 = 39；d = 3 → 52 − 25 = 27。
 *
 *   頁面順序（共 17 頁）：
 *     第 1 頁 個位差 1　　第 2 頁 個位差 2　　第 3 頁 綜合（差 1～2）
 *     第 4 頁 個位差 3　　第 5 頁 綜合（差 1～3）
 *     第 6 頁 個位差 4　　第 7 頁 綜合（差 1～4）
 *     …一直到 第 16 頁 個位差 9、第 17 頁 綜合（差 1～9）
 *
 *   各頁十位數字：所有頁面（個位差 d 頁與綜合頁）十位數字都可以變化（十位差 1～8 均勻挑選），
 *     例如第 1 頁答案可能是 9、19、29…79，第 2 頁答案可能是 8、18、28…78。
 *     makeQ / diffPage 仍保留 fixedGap 參數（十位固定差 1），目前沒有頁面使用。
 *     綜合頁每頁 20 題，各題型平均分配；除不盡的題數多給「較新的、較大的個位差」。
 * 共同條件：被減數、減數都是兩位數；個位一定要借位；答案不為負；同一頁題目不重複。
 */
(function () {
  var kit = MathCore.kit;
  var COUNT = 20, MAX_D = 9;

  // 產生一題：個位差 d；fixedGap 為真時十位固定差 1，否則十位差在 1～8 均勻挑選
  function makeQ(rng, d, fixedGap) {
    var minuendOnes = kit.int(rng, 0, 9 - d);   // 被減數個位（較小）
    var subtrahendOnes = minuendOnes + d;        // 減數個位（較大，所以要借位）
    var gap = fixedGap ? 1 : kit.int(rng, 1, 8);
    var tS = kit.int(rng, 1, 9 - gap);
    var tM = tS + gap;
    return { a: tM * 10 + minuendOnes, op: '-', b: tS * 10 + subtrahendOnes, tag: 'D' + d };
  }

  // 依老師的文字規則獨立檢查一題（用位數運算，不依賴出題程式）
  // tensGap 為 0 代表十位差不限，否則必須剛好等於 tensGap
  function check(q, d, tensGap) {
    if (q.op !== '-') return false;
    if (q.a < 10 || q.a > 99 || q.b < 10 || q.b > 99) return false;
    var m = kit.digits(q.a), s = kit.digits(q.b);
    if (s.ones - m.ones !== d) return false;                  // 個位差 d（同時保證要借位）
    if (m.tens <= s.tens) return false;                        // 被減數較大
    if (tensGap && m.tens - s.tens !== tensGap) return false;  // 十位差（若有指定）
    return (q.a - q.b) % 10 === 10 - d;                        // 差的個位是 10 − d
  }

  // 範例題：個位 0 與 d，十位 8 與 3（差的個位 10 − d）
  function goodQ(d, tag) { return { a: 80, op: '-', b: 30 + d, tag: tag || 'D' + d }; }

  // 「個位差 d」頁
  function diffPage(n, d, fixedGap) {
    var ans = 10 - d;
    var page = {
      id: 'p' + n,
      title: '第 ' + n + ' 頁',
      subtitle: '個位差 ' + d,
      desc: fixedGap
        ? '個位數字相差 ' + d + '、要借位，十位相差 1，每題的差都是 ' + ans + '。'
        : '個位數字相差 ' + d + '、要借位，差的個位數都是 ' + ans + '（十位會變化，答案可能是 ' + ans + '、' + (10 + ans) + '、' + (20 + ans) + '…）。',
      count: COUNT,
      expectTags: {},
      generate: function (rng) {
        return kit.unique(COUNT, function () { return makeQ(rng, d, fixedGap); });
      },
      validate: function (q) {
        return q.tag === 'D' + d && check(q, d, fixedGap ? 1 : 0) && (!fixedGap || q.a - q.b === ans);
      },
      selfTest: {
        good: (fixedGap ? [] : [goodQ(d)]).concat([{ a: 50, op: '-', b: 40 + d, tag: 'D' + d }]),
        bad: [
          { a: 80, op: '-', b: 30 + (d < 9 ? d + 1 : d - 1), tag: 'D' + d },  // 個位差不對
          { a: 80 + d, op: '-', b: 30, tag: 'D' + d },                          // 個位夠減，不用借位
          { a: 30, op: '-', b: 80 + d, tag: 'D' + d }                           // 被減數比減數小
        ]
      }
    };
    page.expectTags['D' + d] = COUNT;
    if (!fixedGap) {
      page.minDistinctAnswers = 4;
      page.selfTest.bad.push({ a: 90, op: '-', b: 20 + d, tag: 'D' + d + 'x' });
    } else {
      page.selfTest.bad.push({ a: 80, op: '-', b: 30 + d, tag: 'D' + d });     // 十位差 5，不是固定差 1
    }
    return page;
  }

  // 「綜合」頁：個位差 1～maxD 各出一些，總共 20 題，十位可變
  function mixPage(n, maxD) {
    var counts = {}, extra = COUNT % maxD, plan = [], k;
    for (k = 1; k <= maxD; k++) {
      counts['D' + k] = Math.floor(COUNT / maxD) + (k > maxD - extra ? 1 : 0);
      for (var j = 0; j < counts['D' + k]; j++) plan.push(k);
    }
    var page = {
      id: 'p' + n,
      title: '第 ' + n + ' 頁',
      subtitle: '綜合 ' + (maxD === 1 ? '1' : '1–' + maxD),
      desc: '個位差 1 到 ' + maxD + ' 的題型混合練習，十位數字會變化。',
      count: COUNT,
      expectTags: counts,
      generate: function (rng) {
        var list = kit.unique(COUNT, function (i) { return makeQ(rng, plan[i], false); });
        return kit.shuffle(rng, list);
      },
      validate: function (q) {
        var m = /^D([1-9])$/.exec(q.tag || '');
        return !!m && Number(m[1]) <= maxD && check(q, Number(m[1]), 0);
      },
      selfTest: { good: [], bad: [] }
    };
    for (k = 1; k <= maxD; k++) page.selfTest.good.push(goodQ(k));
    page.selfTest.bad.push({ a: 80, op: '-', b: 31, tag: 'D2' });               // 標籤與實際個位差不符
    page.selfTest.bad.push({ a: 80 + maxD, op: '-', b: 30, tag: 'D' + maxD });  // 不用借位
    if (maxD < MAX_D) page.selfTest.bad.push({ a: 80, op: '-', b: 30 + maxD + 1, tag: 'D' + (maxD + 1) }); // 超出範圍
    return page;
  }

  // 組出頁面：第 1 頁 d=1、第 2 頁 d=2（十位固定差 1）、第 3 頁 綜合 1–2，
  // 之後每個新的個位差 d 接著一頁「綜合 1–d」
  var pages = [diffPage(1, 1, false), diffPage(2, 2, false), mixPage(3, 2)];
  for (var d = 3; d <= MAX_D; d++) {
    pages.push(diffPage(pages.length + 1, d, false));
    pages.push(mixPage(pages.length + 1, d));
  }

  MathCore.register({
    id: 'sub-borrow',
    title: '借位減法',
    grade: '二年級・兩位數減法',
    tip: '個位不夠減，就向十位借 1：十位少 1，個位多 10，再相減。',
    pages: pages
  });
})();

    setMeterTier(idx);
    if (idx >= 0) {
      var r = S.page.rewards[idx];
      $('clockNote').textContent = '現在交卷（全對）：' + r.medal + '獎杯，玩 ' + r.minutes + ' 分鐘。還有 ' + Math.ceil(r.limit - S.elapsed) + ' 秒保住這一級。';
    } else {
      $('clockNote').textContent = '超過 ' + lim + ' 秒了，這次沒有遊戲時間，不過慢慢寫完也是好練習。';
    }
  }

  function start() {
    S.phase = 'running';
    renderControls();
    $('grid').classList.remove('locked');
    $('lockNote').hidden = true;
    var inputs = document.querySelectorAll('#grid input');
    for (var i = 0; i < inputs.length; i++) inputs[i].disabled = false;
    S.t0 = performance.now();
    tick();
    S.timer = setInterval(tick, 100);
    select(0, true);
  }

  /* ---------- 交卷與批改 ---------- */
  function submit() {
    var inputs = Array.prototype.slice.call(document.querySelectorAll('#grid input'));
    var blanks = inputs.filter(function (el) { return el.value.trim() === ''; });
    if (blanks.length) {
      $('hint').textContent = '還有 ' + blanks.length + ' 題沒寫，寫完再交卷。';
      select(inputs.indexOf(blanks[0]), true);
      return;
    }
    S.elapsed = (performance.now() - S.t0) / 1000;
    stopTimer();
    var correct = 0;
    var cards = document.querySelectorAll('#grid .q');
    S.qs.forEach(function (q, i) {
      var ok = Number(inputs[i].value) === q.answer;
      if (ok) correct++;
      inputs[i].disabled = true;
      cards[i].classList.add(ok ? 'ok' : 'ng');
      cards[i].querySelector('.fb').textContent = ok ? '✓ 答對了' : '✗ 答案是 ' + q.answer;
    });
    var n = S.qs.length, allOk = correct === n;
    var medal = C.rewardFor(S.page, allOk, S.elapsed);
    var before = Store.pageStats(S.mod.id, S.page.id);
    var newBest = allOk && (before.best === null || S.elapsed < before.best);
    Store.addAttempt({ m: S.mod.id, p: S.page.id, sec: S.elapsed, ok: correct, n: n, medal: medal, minutes: medal >= 0 ? S.page.rewards[medal].minutes : 0 });

    S.phase = 'done';
    $('hint').textContent = '';
    setMeterTier(C.rewardFor(S.page, true, S.elapsed));   // 計時條顏色只看時間，不管對錯
    $('clockNote').textContent = '完成時間：' + fmt(S.elapsed) + ' 秒';
    renderStats(); renderControls();
    showResult(correct, n, allOk, medal, newBest);
  }

  var TROPHY = function (i) {
    return '<svg class="trophy ' + tierClass(i) + '" viewBox="0 0 200 215" role="img" aria-label="' + S.page.rewards[i].medal + '獎杯">' +
      '<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" class="tg-a"/><stop offset="1" class="tg-b"/></linearGradient></defs>' +
      '<path d="M52 44H26c0 34 12 52 36 58" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="M148 44h26c0 34-12 52-36 58" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="M52 24h96v56c0 31-21 53-48 53S52 111 52 80z" fill="url(#gold)"/>' +
      '<rect x="90" y="130" width="20" height="30" fill="url(#gold)"/>' +
      '<rect x="58" y="160" width="84" height="28" rx="6" fill="url(#gold)"/>' +
      '<rect x="72" y="171" width="56" height="6" rx="3" style="fill:var(--star)" opacity=".7"/>' +
      '<polygon points="100,50 105.3,64.7 120.9,65.2 108.6,74.8 112.9,89.8 100,81 87.1,89.8 91.4,74.8 79.1,65.2 94.7,64.7" style="fill:var(--star)"/>' +
      '</svg>';
  };

  function burst() {
    var colors = ['var(--accent)', 'var(--gold-a)', 'var(--bad)', 'var(--good)', 'var(--gold-b)'];
    var html = '';
    for (var i = 0; i < 28; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colors[i % colors.length] +
        ';animation-delay:' + (Math.random() * 0.8).toFixed(2) + 's"></i>';
    }
    return '<div class="burst" aria-hidden="true">' + html + '</div>';
  }

  // 鼓勵的話：整數里程碑優先，其次是連續天數
  function cheer(t) {
    var m = { 1: '第一次達標，好的開始！', 3: '已經達標 3 次了，越來越熟練！', 5: '達標 5 次！你是闖關小高手！', 10: '達標 10 次！數學小達人就是你！',
      20: '達標 20 次！太厲害了！', 30: '達標 30 次！超級厲害！', 50: '達標 50 次！你是計算大師！', 100: '達標 100 次！傳說等級！' };
    if (m[t.passes]) return m[t.passes];
    if (t.streak >= 2) return '連續練習 ' + t.streak + ' 天了，每天進步一點點！';
    if (t.todayPasses >= 2) return '今天已經達標 ' + t.todayPasses + ' 次，好厲害！';
    return '常常練習，越來越快！';
  }

  function showResult(correct, n, allOk, medal, newBest) {
    var t = fmt(S.elapsed), tot = Store.totals(), ps = Store.pageStats(S.mod.id, S.page.id), body;
    var best = S.page.rewards[S.page.rewards.length - 1];
    if (medal >= 0) {
      var r = S.page.rewards[medal];
      body = burst() + TROPHY(medal) + '<h2>' + r.medal + '獎杯！恭喜達標！</h2>' +
        '<p class="big">這是你累計第 <b>' + tot.passes + '</b> 次達標，這一頁的第 <b>' + ps.passes + '</b> 次。</p>' +
        '<p>' + n + ' 題全對，用了 <b>' + t + ' 秒</b>' + (newBest ? '，刷新這一頁的最佳時間' : '') + '。獲得 <b>' + r.minutes + ' 分鐘</b>遊戲時間！</p>' +
        '<p class="cheer"></p>';
    } else if (allOk) {
      body = '<h2>全部答對！</h2><p>用了 ' + t + ' 秒，要在 ' + best.limit + ' 秒內交卷才有遊戲時間。再挑戰一次，一定可以！</p>' +
        '<p class="cheer"></p>';
    } else {
      body = '<h2>答對 ' + correct + ' / ' + n + ' 題</h2><p>紅色的題卡有標出正確答案，看看哪裡算錯了。</p>' +
        (S.mod.tip ? '<p><b>小提醒：</b>' + S.mod.tip + '</p>' : '') + '<p class="cheer"></p>';
    }
    $('resultBody').innerHTML = body;
    $('resultBody').querySelector('.cheer').textContent = medal >= 0 ? cheer(tot) : '今天已練習 ' + tot.todayTries + ' 次' + (tot.streak ? '，連續 ' + tot.streak + ' 天' : '') + '，練習就是進步！';
    var res = $('result');
    res.focus({ preventScroll: true });
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    res.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    if (medal >= 0) startAuto(); else stopAuto();
  }

  /* ---------- 過關後自動進入遊戲（5 秒倒數，可取消） ---------- */
  var autoTimer = null;
  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    $('autoNote').hidden = true;
  }
  function startAuto() {
    stopAuto();
    var left = 5, note = $('autoNote');
    function paintAuto() {
      note.innerHTML = '<span></span><button type="button" class="linkbtn" id="autoCancel">先不玩</button>';
      note.firstChild.textContent = left + ' 秒後自動進入消消樂…';
      $('autoCancel').addEventListener('click', stopAuto);
    }
    paintAuto(); note.hidden = false;
    autoTimer = setInterval(function () {
      left--;
      if (left <= 0) { playGame(); return; }
      note.firstChild.textContent = left + ' 秒後自動進入消消樂…';
    }, 1000);
  }

  /* ---------- 獎勵遊戲 ---------- */
  function playGame() {
    stopAuto();
    var secs = Store.getBank();
    if (secs <= 0 || MathGame.isOpen() || S.phase === 'running') return;
    MathGame.open({
      seconds: secs, level: Store.getLevel(),
      onLevel: function (L) { Store.setLevel(L); },
      onSave: function (left) { Store.setBank(left); },
      onClose: function (left) { Store.setBank(left); renderTop(); updatePlay(); }
    });
  }

  /* ---------- 我的紀錄 ---------- */
  var cal = { y: 0, m: 0 }, logFocus = null, clearTimer = null;
  function lookup(mid, pid) {
    var m = mods.filter(function (x) { return x.id === mid; })[0], p = m && m.pages.filter(function (x) { return x.id === pid; })[0];
    return m && p ? m.title + '　' + p.title + (p.subtitle ? '（' + p.subtitle + '）' : '') : mid + ' ' + pid;
  }
  function renderLog() {
    var tot = Store.totals();
    var items = [['累計達標', tot.passes, '次'], ['連續練習', tot.streak, '天'], ['練習過', tot.days, '天'], ['練習總數', tot.attempts, '次'], ['消消樂關卡', Store.getLevel(), '']];
    $('logStats').innerHTML = items.map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + x[1] + '<small>' + x[2] + '</small></dd></div>'; }).join('');

    var days = Store.byDay(), today = Store.today(), now = new Date(Store.now());
    var first = new Date(cal.y, cal.m, 1).getDay(), count = new Date(cal.y, cal.m + 1, 0).getDate(), html = '', i;
    ['日', '一', '二', '三', '四', '五', '六'].forEach(function (w) { html += '<div class="cw">' + w + '</div>'; });
    for (i = 0; i < first; i++) html += '<div></div>';
    for (i = 1; i <= count; i++) {
      var ds = cal.y + '-' + two(cal.m + 1) + '-' + two(i), d = days[ds], cls = 'cd' + (d ? (d.passes ? ' pass' : ' try') : '') + (ds === today ? ' today' : '');
      var label = (cal.m + 1) + '月' + i + '日' + (d ? '，練習 ' + d.tries + ' 次' + (d.passes ? '，達標 ' + d.passes + ' 次' : '') : '');
      html += '<div class="' + cls + '" aria-label="' + label + '">' + i + '</div>';
    }
    $('calGrid').innerHTML = html;
    $('calTitle').textContent = cal.y + ' 年 ' + (cal.m + 1) + ' 月';
    $('calNext').disabled = cal.y === now.getFullYear() && cal.m === now.getMonth();

    var rec = Store.recent(15);
    $('logList').innerHTML = rec.length ? '' : '<li class="empty">還沒有紀錄。做一頁練習，這裡就會出現第一筆！</li>';
    rec.forEach(function (e) {
      var d = new Date(e.t), li = document.createElement('li'), res;
      if (e.pass) res = '達標・' + ((S.page.rewards[e.medal] || {}).medal || '') + '獎杯・' + e.mins + ' 分鐘';
      else if (e.ok === e.n) res = '全對，超過時間';
      else res = '答對 ' + e.ok + '/' + e.n;
      li.innerHTML = '<span class="ld"></span><span class="lw"></span><span class="lr' + (e.pass ? ' pass' : '') + '"></span>';
      li.children[0].textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
      li.children[1].textContent = lookup(e.m, e.p) + '・' + e.sec + ' 秒';
      li.children[2].textContent = res;
      $('logList').appendChild(li);
    });
  }
  function openLog() {
    if (S.phase === 'running') return;
    stopAuto();
    var now = new Date(Store.now());
    cal.y = now.getFullYear(); cal.m = now.getMonth();
    logFocus = document.activeElement;
    renderLog();
    $('logOverlay').hidden = false;
    document.body.classList.add('playing');
    document.querySelector('.wrap').inert = true;
    $('logClose').focus();
  }
  function closeLog() {
    $('logOverlay').hidden = true;
    document.body.classList.remove('playing');
    document.querySelector('.wrap').inert = false;
    clearTimeout(clearTimer); $('logClear').textContent = '清除全部紀錄';
    if (logFocus && logFocus.focus) { try { logFocus.focus({ preventScroll: true }); } catch (e) { /* 略過 */ } }
    renderStats(); renderTop(); updatePlay();
  }
  function moveMonth(d) {
    cal.m += d;
    if (cal.m < 0) { cal.m = 11; cal.y--; } else if (cal.m > 11) { cal.m = 0; cal.y++; }
    renderLog();
  }

  function retrySame() {
    stopAuto();
    var inputs = document.querySelectorAll('#grid input');
    for (var i = 0; i < inputs.length; i++) inputs[i].value = '';
    S.phase = 'ready';
    renderAll();
  }

  /* ---------- 事件 ---------- */
  $('btnStart').addEventListener('click', start);
  $('btnSubmit').addEventListener('click', submit);
  $('btnSame').addEventListener('click', retrySame);
  $('btnNew').addEventListener('click', newSet);
  $('btnPlay').addEventListener('click', playGame);
  $('btnBank').addEventListener('click', playGame);
  $('btnLog').addEventListener('click', openLog);
  $('logClose').addEventListener('click', closeLog);
  $('calPrev').addEventListener('click', function () { moveMonth(-1); });
  $('calNext').addEventListener('click', function () { moveMonth(1); });
  // 清除紀錄要按兩次，避免孩子不小心按到
  $('logClear').addEventListener('click', function () {
    var b = $('logClear');
    if (b.getAttribute('data-arm') === '1') {
      clearTimeout(clearTimer); b.removeAttribute('data-arm'); b.textContent = '清除全部紀錄';
      Store.clearAll(); renderLog();
    } else {
      b.setAttribute('data-arm', '1'); b.textContent = '再按一次，確定清除';
      clearTimer = setTimeout(function () { b.removeAttribute('data-arm'); b.textContent = '清除全部紀錄'; }, 4000);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('logOverlay').hidden) closeLog(); });

  /* ---------- 內建數字鍵盤 ----------
   * 答案欄是唯讀的，輸入全部走這組鍵盤（外接實體鍵盤的 0–9、Backspace、Enter 也可用），
   * 所以平板的系統鍵盤不會升起來遮住題目。 */
  var cards = function () { return document.querySelectorAll('#grid .q'); };
  var reduceMotion = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };

  // 窄螢幕時鍵盤貼在下方，量出它的高度，讓題目不會被擋住
  function updateDock() {
    var pad = $('pad'), fixed = !pad.hidden && getComputedStyle(pad).position === 'fixed';
    document.body.style.setProperty('--dock-h', fixed ? pad.offsetHeight + 'px' : '0px');
  }
  window.addEventListener('resize', updateDock);

  // 選定要作答的題目。replace 為真時，下一個輸入的數字會取代原本的答案
  function select(i, replace, noScroll) {
    var cs = cards();
    if (i < 0 || i >= cs.length) return;
    S.cur = i; S.replace = !!replace;
    for (var k = 0; k < cs.length; k++) cs[k].classList.toggle('cur', k === i);
    $('padNext').textContent = i === cs.length - 1 ? '交卷' : '下一題';
    if (!noScroll) cs[i].scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
  }

  function pressDigit(d) {
    if (S.phase !== 'running') return;
    var el = $('ans' + S.cur), q = S.qs[S.cur];
    var v = S.replace ? '' : el.value;
    S.replace = false;
    if (v.length >= 3) return;
    v += d;
    el.value = v;
    $('hint').textContent = '';
    // 打滿正確答案的位數就自動跳下一題；最後一題停在原地，等學生按「交卷」
    if (v.length >= String(q.answer).length && S.cur < S.qs.length - 1) select(S.cur + 1, true);
  }

  function pressBack() {
    if (S.phase !== 'running') return;
    var el = $('ans' + S.cur);
    if (el.value === '') { if (S.cur > 0) select(S.cur - 1, true); return; }   // 空白格按刪除，回上一題
    if (S.replace) { el.value = ''; S.replace = false; } else el.value = el.value.slice(0, -1);
  }

  function pressNext() {
    if (S.phase !== 'running') return;
    if (S.cur === S.qs.length - 1) submit(); else select(S.cur + 1, true);
  }

  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var k = b.getAttribute('data-k');
    if (k === 'back') pressBack(); else if (k === 'next') pressNext(); else pressDigit(k);
  });
  // 點任何一題都可以回去修改
  $('grid').addEventListener('click', function (e) {
    if (S.phase !== 'running') return;
    var li = e.target.closest('.q');
    var i = li ? Array.prototype.indexOf.call(cards(), li) : -1;
    if (i >= 0) select(i, true);
  });
  // 外接實體鍵盤
  document.addEventListener('keydown', function (e) {
    if (S.phase !== 'running' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressDigit(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); pressBack(); }
    else if (e.key === 'Enter') { e.preventDefault(); pressNext(); }
  });

  newSet();
})();

</script>

</body>
</html>
