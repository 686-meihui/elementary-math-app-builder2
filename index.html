<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語文常識闖關站｜書信與題辭</title>
<style>
:root{
  --paper:#f7f1e3; --card:#fffdf7; --ink:#2b2622; --muted:#7a6f63; --line:#e3d8c3;
  --red:#b8382c; --red-soft:#f6e1dc; --green:#2f7d4f; --green-soft:#ddf0e3;
  --blue:#2d5b8a; --blue-soft:#e1ebf5; --gold:#c08a1e; --gold-soft:#f8ecd0;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.seal{width:46px;height:46px;border:3px solid var(--red);color:var(--red);border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px;transform:rotate(-4deg);flex:none}
h1{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:1px}
.sub{color:var(--muted);font-size:15px}
h2{font-family:var(--serif);font-size:22px;margin:26px 0 10px;border-left:6px solid var(--red);padding-left:10px}
h3{font-family:var(--serif);font-size:19px;margin:20px 0 8px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.how{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.how b{color:var(--ink)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.chip.learn{background:var(--blue-soft);color:var(--blue)}
.chip.mix{background:var(--gold-soft);color:#8a5d00}
.chip.exam{background:var(--red-soft);color:var(--red)}
.section-title{font-family:var(--serif);font-size:18px;margin:22px 0 8px;color:var(--muted);letter-spacing:2px}
.path{display:grid;gap:10px}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;color:inherit;transition:transform .08s,box-shadow .15s}
.node:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(80,60,30,.10)}
.node .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--serif)}
.node.learn .num{background:var(--blue-soft);color:var(--blue)}
.node.mix{border-color:#e8cf95;background:#fffaf0}
.node.mix .num{background:var(--gold-soft);color:#8a5d00}
.node.exam{border-color:#e9b7ae;background:#fff7f5}
.node.exam .num{background:var(--red);color:#fff}
.node .t{font-weight:700}
.node .d{font-size:14px;color:var(--muted)}
.node .stars{margin-left:auto;font-size:18px;letter-spacing:2px;color:#d8cdb8;flex:none}
.node .stars .on{color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--ink);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
select{font-size:15px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.back{background:none;border:none;color:var(--muted);padding:0;margin-bottom:6px;font-size:15px}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15.5px;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{background:#f1e8d6;font-weight:700;text-align:left}
.tip{background:var(--gold-soft);border-left:5px solid var(--gold);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15.5px}
.warn{background:var(--red-soft);border-left:5px solid var(--red);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15.5px}
.k{color:var(--red);font-weight:700}
.letter{font-family:var(--serif);background:#fffef9;border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:18px;line-height:2.1}
.letter .sig{text-align:right}
.seg{border-radius:4px;padding:1px 2px}
.seg.hl{background:#ffe08a;border-bottom:3px solid var(--red)}
.lab{font-size:12px;font-family:var(--sans);color:#fff;border-radius:4px;padding:0 4px;margin:0 2px;vertical-align:super}
.c1{background:#e7f0fb}.c2{background:#fbe9e4}.c3{background:#eaf5ea}.c4{background:#f6eefb}
.legend span{display:inline-block;margin:2px 6px 2px 0;padding:0 6px;border-radius:4px;font-size:14px}
/* envelope */
.env{position:relative;width:250px;height:360px;background:#fffef6;border:1.5px solid #bfae8e;border-radius:6px;margin:10px auto;display:flex;flex-direction:row-reverse;justify-content:space-between;padding:56px 14px 16px;font-family:var(--serif)}
.env .zip{position:absolute;top:10px;right:12px;font-size:13px;letter-spacing:3px;font-family:var(--sans)}
.env .zip2{position:absolute;bottom:8px;left:12px;font-size:12px;letter-spacing:2px;font-family:var(--sans)}
.env .stamp{position:absolute;top:10px;left:12px;width:38px;height:46px;border:1.5px dashed var(--red);color:var(--red);font-size:11px;display:grid;place-items:center;font-family:var(--sans)}
.env .col{writing-mode:vertical-rl;text-orientation:upright}
.env .rcol{font-size:14px;padding-top:6px}
.env .ccol{font-size:26px;font-weight:700;align-self:center;display:flex;align-items:center}
.env .ccol .nm{font-size:20px;margin-right:6px}
.env .lcol{font-size:13px;padding-top:70px}
.env .tag{writing-mode:horizontal-tb;font-size:11px;color:var(--blue);font-family:var(--sans);font-weight:400}
.envs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.envs .env{width:150px;height:260px;padding:40px 8px 10px}
.envs .env .ccol{font-size:20px}
.mini{display:inline-block;margin:4px;text-align:center}
.mini .lbl{font-weight:700}
.post{font-family:var(--serif);border:1.5px solid #bfae8e;background:#fffef6;border-radius:6px;padding:12px 16px;max-width:420px;margin:8px auto;font-size:15px;position:relative}
.post .stamp{position:absolute;right:12px;top:10px;width:40px;height:46px;border:1.5px dashed var(--red);color:var(--red);font-size:11px;display:grid;place-items:center;font-family:var(--sans)}
.invite{font-family:var(--serif);background:#fff4f2;border:2px solid #d9a39a;border-radius:8px;padding:14px 18px;line-height:2;font-size:16px}
.note{font-family:var(--serif);background:#fffbe6;border:1px solid #e7d58c;border-radius:6px;padding:12px 16px;max-width:460px;font-size:17px;line-height:2}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;background:#eadfca;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.qtext{font-size:19px;margin:12px 0;line-height:1.9}
.qtext .big{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink);display:inline-block;padding:2px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;margin:4px 0}
.opts{display:grid;gap:10px;margin-top:10px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px;color:var(--ink);line-height:1.6}
.opt:hover:not(:disabled){border-color:#bba98a;background:#fffdf5}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt .lt{display:inline-block;width:26px;font-weight:700;color:var(--muted)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px;display:none}
.fb.ok{display:block;background:var(--green-soft);border-left:5px solid var(--green)}
.fb.no{display:block;background:var(--red-soft);border-left:5px solid var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px;vertical-align:middle}
.badge.hk{background:var(--red);color:#fff}
.badge.rel{background:var(--blue-soft);color:var(--blue)}
.result{text-align:center}
.result .score{font-family:var(--serif);font-size:48px;font-weight:700}
.result .bigstars{font-size:40px;letter-spacing:6px;color:#d8cdb8}
.result .bigstars .on{color:var(--gold)}
.wronglist{text-align:left;font-size:15px}
.wronglist li{margin:6px 0}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;font-weight:700}
.timer.late{color:#c06a00}.timer.over{color:var(--red)}
.hidden{display:none!important}
.readdone{text-align:center;margin:24px 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pair{display:flex;gap:8px;flex-wrap:wrap}
.pair span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-family:var(--serif)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:4px 0}
.vs .mid{color:var(--muted);font-size:13px}
.vs div:first-child{text-align:right}
.pass{margin-left:auto;font-size:13px;color:var(--muted);flex:none;text-align:right}
.pass.ok{color:var(--green);font-weight:700}.pass.none{color:#c8bca6}
.bigpass{display:inline-block;margin:6px 0;padding:4px 18px;border-radius:99px;background:#eee4d2;color:var(--muted);font-weight:700;font-size:20px}
.bigpass.ok{background:var(--green-soft);color:var(--green)}
.ok-t{color:var(--green)}
.login label{display:block;margin:10px 0;font-weight:700}
.login input,.login select{font-size:17px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-left:8px;width:200px}
.tscroll{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:10px}
.tt{font-size:13px;margin:0;white-space:nowrap}
.tt th{position:sticky;top:0;z-index:1;text-align:center}
.tt td{text-align:center;padding:4px 6px}
.cell.ok{background:var(--green-soft);color:var(--green)}
.cell.bad{background:#f7efe3;color:#8a6d3b}
.cell.fast{background:#fff1c2;color:#8a5d00}
.legend2 .cell{display:inline-block;padding:0 6px;border-radius:4px;margin:0 4px}
footer{color:var(--muted);font-size:13px;margin-top:30px;text-align:center}
@media (max-width:520px){h1{font-size:22px}.qtext{font-size:18px}.qtext .big{font-size:26px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   語文常識闖關站：可擴充的單元架構
   新增主題時：在 MODULES 加一個模組，裡面放 stages（learn / mix / exam）。
   ========================================================= */

// ---------- 小工具 ----------
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniq = a => [...new Set(a)];
const LT = ['A','B','C','D','E','F'];
function sampleDistinct(pool, n, exclude=[]){ return shuffle(uniq(pool).filter(x=>!exclude.includes(x))).slice(0,n); }
function mc(q, correct, distractors, exp, extra={}){
  const opts = shuffle([correct, ...distractors.slice(0,3)]);
  return Object.assign({q, opts, ans:[opts.indexOf(correct)], exp}, extra);
}
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---------- 題型產生器 ----------
// 分類題：items = [[詞, '可接受的標籤(可多個)'], ...]
function genClassify(items, labels, promptFn, expFn){
  return () => {
    const it = pick(items); const keys = Object.keys(labels);
    const opts = keys.map(k=>labels[k]);
    const ans = keys.map((k,i)=> it[1].includes(k)?i:-1).filter(i=>i>=0);
    const exp = expFn ? expFn(it) : `「${it[0]}」→ ${ans.map(i=>opts[i]).join(' 或 ')}`;
    return {q: promptFn(it[0]), opts, ans, exp, cols:true, key:'c'+it[0]};
  };
}
// 配對題：pairs = [[詞(可用、分隔同義), 說明]]，雙向出題
function genPairs(pairs, toMeaning, toTerm){
  return () => {
    const p = pick(pairs); const terms = p[0].split('、'); const term = pick(terms);
    const others = pairs.filter(x=>x!==p && x[1]!==p[1]);
    if (toTerm && (!toMeaning || Math.random()<.5)){
      const ds = shuffle(others).slice(0,3).map(x=>pick(x[0].split('、')));
      return mc(toTerm(p[1]), term, ds, `「${p[1]}」→「${p[0]}」`, {key:'p'+p[1]});
    }
    const ds = shuffle(others).slice(0,3).map(x=>x[1]);
    return mc(toMeaning(term), p[1], ds, `「${p[0]}」：${p[1]}`, {key:'p'+term});
  };
}
function genFixed(list){
  return () => { const f = pick(list); return mc(f[0], f[1], f[2], f[3]||'', {key:'f'+f[0]}); };
}

// =========================================================
//                      資料：書信
// =========================================================
const OBJ5 = {A:'直系長輩', B:'旁系長輩', C:'師長', D:'平輩', E:'晚輩'};
const OBJ5_NOTE = '直系長輩＝祖父母、父母；旁系長輩＝伯叔、舅姨、姑等其他長輩';
const OBJ3 = {A:'長輩', B:'平輩', C:'晚輩'};

const PARTS = ['稱謂','提稱語','啟事敬詞','開頭應酬語','正文','結尾應酬語','申悃語','問候語','自稱','署名','末啟詞','日期'];
const PART_DEF = [
  ['稱謂','對收信人的稱呼，寫在信的第一行並頂格'],
  ['提稱語','請對方讀信的意思，現代書信常以冒號代替'],
  ['啟事敬詞','發語詞，表示要開始述說事情，如「敬稟者」'],
  ['開頭應酬語','說正事前的客套話：表思念、感謝或頌揚對方'],
  ['正文','信中談論主要事情的文字'],
  ['結尾應酬語','正文結束時，為避免突然收結而說的客氣話'],
  ['申悃語','說明自己的話出於誠意，如「謹此奉稟」「專此」'],
  ['問候語','又稱祝福語，問候對方安好，如「敬請　大安」'],
  ['自稱','寫信人對自己的稱呼，字略小偏右以示謙卑'],
  ['署名','寫信人的名字；對近親只寫名'],
  ['末啟詞','表示把信中的事恭敬告訴對方，如「叩上」「敬啟」'],
  ['日期','完成這封信的日期']
];
const OMITTED = ['提稱語','啟事敬詞','開頭應酬語','結尾應酬語','申悃語'];
const KEPT = ['稱謂','正文','問候語','自稱','署名','末啟詞','日期'];

// 範例書信（分段標記）
const LETTERS = [
  { title:'給母親（課本範例）', segs:[
    ['稱謂','母親大人'],['提稱語','膝下'],[null,'：'],['啟事敬詞','敬稟者'],[null,'，'],
    ['開頭應酬語','自叩別　慈顏，孺慕之思與日俱增。'],
    ['正文','兒上週五抵達洛杉磯，今已赴校就學，一切順利，請勿掛念。'],
    ['結尾應酬語','時值夏季，天候酷熱，兒遠離家鄉，不克侍奉左右，敬祈珍重　福體。'],
    ['申悃語','謹此奉稟'],[null,'，'],['問候語','恭請<br>福安'],[null,'<div class="sig">'],
    ['自稱','<small>兒</small>'],['署名','家生'],['末啟詞','叩上'],['日期','○月○日'],[null,'</div>']]},
  { title:'給母親（老師簡報範例）', segs:[
    ['稱謂','母親大人'],['提稱語','膝下'],[null,'：'],['啟事敬詞','敬稟者'],[null,'，'],
    ['開頭應酬語','自拜別　慈顏後，思念殷切。'],
    ['正文','於二十一日下午抵達臺南後，隨即辦妥住宿事宜，順利入住，請勿掛念。'],
    ['結尾應酬語','近來天候多變，懇請早晚添衣，注重保暖。'],
    ['申悃語','謹此奉稟'],[null,'，'],['問候語','叩請<br>福安'],[null,'<div class="sig">'],
    ['自稱','<small>兒</small>'],['署名','宗翰'],['末啟詞','敬稟'],['日期','三月二十八日'],[null,'</div>']]},
  { title:'給朋友（平輩範例）', segs:[
    ['稱謂','捷綸兄'],['提稱語','足下'],[null,'：<br>　　'],
    ['開頭應酬語','日前至貴府歡聚，承蒙賢伉儷熱情款待及令郎驅車接送，深情厚誼，我與小兒銘感五內。'],
    ['正文','欣逢中秋佳節，家母與舍弟均來家中團聚，愚夫婦擬在寒舍敬備菲酌，恭請您及尊夫人大駕光臨，共賞明月，把酒話舊。'],
    ['申悃語','專此'],[null,'，'],['問候語','敬請<br>大安'],[null,'<div class="sig">'],
    ['自稱','<small>弟</small>'],['署名','阿信'],['末啟詞','謹啟'],['日期','九月二日'],[null,'</div>']]}
];
function renderLetter(L, hlPart, labels){
  return '<div class="letter">' + L.segs.map(([p,t])=>{
    if(!p) return t;
    const cls = p===hlPart ? 'seg hl' : 'seg';
    const lab = labels ? `<span class="lab" style="background:${partColor(p)}">${p}</span>` : '';
    return `<span class="${cls}">${t}</span>${lab}`;
  }).join('') + '</div>';
}
function partColor(p){ const i=PARTS.indexOf(p); return ['#2d5b8a','#4a7bb0','#6a8fc0','#7c6bb0','#2f7d4f','#a0732a','#b8382c','#c0562c','#555','#555','#8a3a8a','#777'][i]||'#555'; }

const TITLE3 = [ // 書信稱謂：長平晚（老師講義）
  ['伯伯','A'],['姑母','A'],['老師','A'],['叔叔','A'],['阿姨','A'],['姨丈','A'],['舅舅','A'],['祖母','A'],
  ['哥哥','B'],['弟弟','B'],['學長','B'],['同學','B'],['朋友','B'],['學妹','B'],['表姐','B'],
  ['孫子','C'],['小犬','C'],['外甥','C'],['賢姪','C'],['女兒','C']
];
const TICHENG = [ // 提稱語
  ['膝下','A'],['膝前','A'],['尊前','B'],['尊鑒','B'],['鈞鑒','B'],['道鑒','C'],['函丈','C'],
  ['大鑒','D'],['臺鑒','D'],['惠鑒','D'],['足下','D'],['左右','D'],
  ['知之','E'],['知悉','E'],['如晤','E'],['如握','E'],['收悉','E']
];
const WENHOU = [ // 問候語
  ['敬請　福安','A'],['叩請　金安','A'],['恭請　鈞安','B'],['恭請　崇安','B'],['敬請　教安','C'],['敬請　道安','C'],
  ['敬請　臺安','D'],['敬請　大安','D'],['順頌　時祺','D'],['即問　近好','E'],['順問　近祺','E']
];
const MOQI = [ // 末啟詞
  ['叩上','A'],['敬稟','A'],['叩稟','A'],['謹上','BC'],['敬上','BC'],['謹啟','D'],['敬啟','D'],['頓首','D'],['手書','E'],['字','E'],['示','E']

function ticiGen(scope, mode){
  const pool = TICI.filter(x=>x.cats.some(c=>scope.includes(c)));
  return () => {
    const it = pick(pool);
    const m = mode || pick(['t2c','c2t']);
    if (m==='t2c'){
      const c = it.cats.find(c=>scope.includes(c));
      let dcats = scope.filter(k=>!it.cats.includes(k));
      if (dcats.length<3) dcats = Object.keys(CAT).filter(k=>!it.cats.includes(k));
      const ds = sampleDistinct(dcats.map(k=>CAT[k]),3,[CAT[c]]);
      return mc(`題辭 <span class="big">${it.t}</span><br>最適合用於哪一種場合？`, CAT[c], ds, tiExp(it), {key:'t'+it.t});
    } else {
      const c = pick(it.cats.filter(c=>scope.includes(c)));
      let dpool = pool.filter(x=>!x.cats.includes(c));
      if (dpool.length<3) dpool = TICI.filter(x=>!x.cats.includes(c));
      const ds = shuffle(dpool).slice(0,3).map(x=>x.t);
      return mc(`要祝賀／致意的場合是「<b>${CAT[c]}</b>」，下列題辭何者最恰當？`, it.t, ds, tiExp(it), {key:'t'+it.t});
    }
  };
}
function tiExp(it){
  const k = Object.keys(TICI_KEY).sort((a,b)=>b.length-a.length).find(k=>it.t.includes(k));
  return `「${it.t}」→ ${it.cats.map(c=>CAT[c]).join('／')}${k? '。記憶關鍵：'+TICI_KEY[k]:''}`;
}
function genBigClass(){ // 慶賀 / 哀輓 / 題贈題字
  const it = pick(TICI.filter(x=>x.cats.length));
  const c = it.cats[0];
  const big = c.startsWith('M') ? '哀輓類' : c.startsWith('T') ? '題贈・題字類' : '慶賀類';
  return {q:`題辭 <span class="big">${it.t}</span><br>屬於哪一大類？`, opts:['慶賀類','哀輓類','題贈・題字類'], ans:[['慶賀類','哀輓類','題贈・題字類'].indexOf(big)], exp:tiExp(it), cols:true, key:'b'+it.t};
}
function genConfuse(){
  const p = pick(CONFUSE); const first = Math.random()<.5;
  const [t,a,t2,a2] = first ? p : [p[2],p[3],p[0],p[1]];
  return mc(`易混淆題辭：<span class="big">${t}</span> 適用於？`, a, [a2, ...sampleDistinct(CONFUSE.flatMap(x=>[x[1],x[3]]),3,[a,a2])].slice(0,3),
    `「${t}」用於${a}；「${t2}」用於${a2}。`, {key:'cf'+t});
}

const app = document.getElementById('app');
let student = store.get('lt_student', null);
let progress = {};
let readDone = {};
function sid(){ return student ? `${student.cls}-${student.seat}` : 'guest'; }
function loadStudent(){ progress = store.get('lt_prog_'+sid(), {}); readDone = store.get('lt_read_'+sid(), {}); }
function saveProg(){ store.set('lt_prog_'+sid(), progress); store.set('lt_read_'+sid(), readDone); }
let numbering = {};
(function(){ let i=0; MODULES[0].sections.forEach(s=>s.stages.forEach(st=>{ if(st.type==='learn') numbering[st.u]=++i; })); })();
const EXAM_PARTS = ['letter','title','tici'];

function stageId(st){ return st.type==='learn' ? st.u : st.id; }
function stageName(st){ return st.type==='learn' ? `單元${numbering[st.u]} ${U[st.u].title}` : st.title; }
function isPassed(id){ return !!(progress[id] && progress[id].passed); }
function badgeHTML(id){
  const p = progress[id];
  if (p && p.passed) return `<span class="pass ok">✔ 過關 <small>${fmtSec(p.passSecs)}</small></span>`;
  if (p) return `<span class="pass">已練 ${p.tries} 回・最佳 ${p.best}/${p.n}</span>`;
  return `<span class="pass none">未開始</span>`;
}
function fmtSec(s){ return `${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`; }

function login(){
  const clsInput = CONFIG.CLASSES.length
    ? `<select id="cls">${CONFIG.CLASSES.map(c=>`<option>${c}</option>`).join('')}</select>`
    : `<input id="cls" placeholder="例：801">`;
  app.innerHTML = `<header class="top"><div class="seal">語</div><div><h1>語文常識闖關站</h1><div class="sub">國中國文・書信與題辭</div></div></header>
  <div class="card login"><h2 style="margin-top:0">請先登入</h2>
  <label>班級 ${clsInput}</label>
  <label>座號 <input id="seat" type="number" min="1" max="60" placeholder="例：7"></label>
  <label>姓名 <input id="nm" placeholder="請輸入真實姓名"></label>
  <div id="lerr" class="warn hidden"></div>
  <button class="btn red" id="lgo">開始闖關</button>
  <p class="sub">每一關都要<b>全對</b>，而且要在<b>時間內</b>完成才算過關喔！</p></div>
  <div style="text-align:center"><button class="btn ghost small" id="tch">老師端</button></div>`;
  document.getElementById('lgo').onclick = ()=>{
    const cls = document.getElementById('cls').value.trim(), seat = String(+document.getElementById('seat').value||''), name = document.getElementById('nm').value.trim();
    const err = document.getElementById('lerr');
    if(!cls || !seat || seat==='0' || !name){ err.textContent='班級、座號、姓名都要填喔！'; err.classList.remove('hidden'); return; }
    student = {cls, seat, name}; store.set('lt_student', student); loadStudent(); home();
  };
  document.getElementById('tch').onclick = teacher;
}

function home(){
  if(!student) return login();
  const M = MODULES[0];
  const all = allStages().filter(s=>s.type!=='exam'); const done = all.filter(s=>isPassed(stageId(s))).length + EXAM_PARTS.filter(g=>isPassed('e1'+g)).length;
  const totalN = all.length + EXAM_PARTS.length;
  let h = `<header class="top"><div class="seal">語</div><div style="flex:1"><h1>語文常識闖關站</h1><div class="sub">國中國文・${M.title}｜${M.sub}</div></div></header>
  <div class="card how"><span>👤 <b>${student.cls} 班 ${student.seat} 號 ${student.name}</b></span>
  <span>已過關 <b>${done}</b> / ${totalN} 關</span>
  <button class="btn ghost small" id="swap" style="margin-left:auto">換人登入</button></div>
  <div class="card how"><b>闖關方式：</b><span class="chip learn">📖 單元</span>先閱讀重點，再分項練習
  <span>→</span><span class="chip mix">🔀 合併</span>混合複習 <span>→</span><span class="chip exam">🏆 會考</span>挑戰真題
  <span>｜每回 ${CONFIG.ROUND_N} 題，<b>全對</b>且在 <b>${CONFIG.LIMIT_MIN} 分鐘內</b>完成才算過關（會考每組 ${CONFIG.EXAM_LIMIT_MIN} 分鐘）</span></div>
  ${CONFIG.GAS_URL?'':'<div class="warn">（尚未設定成績回傳網址：成績只會存在這台電腦。）</div>'}`;
  M.sections.forEach(sec=>{
    h += `<div class="section-title">— ${sec.name} —</div><div class="path">`;
    sec.stages.forEach(st=>{
      const id = stageId(st);
      if(st.type==='learn'){ const u=U[st.u];
        h += `<button class="node learn" data-go="learn:${st.u}"><span class="num">${numbering[st.u]}</span><span><div class="t">${u.title}</div><div class="d">${u.desc}${readDone[st.u]?'・已讀':''}</div></span>${badgeHTML(id)}</button>`;
      } else if(st.type==='mix'){
        h += `<button class="node mix" data-go="mix:${st.id}"><span class="num">合</span><span><div class="t">${st.title}</div><div class="d">${st.desc}</div></span>${badgeHTML(id)}</button>`;
      } else {
        const n = EXAM_PARTS.filter(g=>isPassed('e1'+g)).length;
        h += `<button class="node exam" data-go="exam:${st.id}"><span class="num">考</span><span><div class="t">${st.title}</div><div class="d">分三組作答，每組全對才過關</div></span><span class="pass ${n===3?'ok':''}">${n===3?'✔ ':''}過關 ${n} / 3 組</span></button>`;
      }
    });
    h += `</div>`;
  });
  h += `<footer>資料來源：課本第四冊主題專區、麻辣講義 12、課堂簡報、麻辣總複習卷、1～4冊會考模擬試題。</footer>`;
  app.innerHTML = h; window.scrollTo(0,0);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const [t,id]=b.dataset.go.split(':'); if(t==='learn') learn(id); else if(t==='mix') startMix(id); else startExam(); });
  document.getElementById('swap').onclick = ()=>{ student=null; store.set('lt_student', null); login(); };
}

function findStage(pred){ for(const s of MODULES[0].sections) for(const st of s.stages) if(pred(st)) return st; }
function allStages(){ return MODULES[0].sections.flatMap(s=>s.stages); }
function nextStage(cur){ const a=allStages(); const i=a.indexOf(cur); return a[i+1]; }

function learn(uid){
  const u = U[uid];
  app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button>
  <h2>單元 ${numbering[uid]}　${u.title}</h2>
  <div class="toolbar"><span class="chip learn">第一步：閱讀學習</span><span class="sub">讀完再按最下方按鈕開始練習</span></div>
  <div class="card">${u.read}</div>
  <div class="readdone"><button class="btn red" id="go">我讀完了，開始練習 →</button></div>`;
  window.scrollTo(0,0);
  document.getElementById('bk').onclick = home;
  document.getElementById('go').onclick = ()=>{ readDone[uid]=1; saveProg(); startQuiz({id:uid, title:`單元 ${numbering[uid]}　${u.title}`, gens:u.gens.map(g=>({g,u:uid})), stage:findStage(s=>s.u===uid), readUid:uid}); };
}
function startMix(id){
  const st = findStage(s=>s.id===id);
  startQuiz({id, title:st.title, gens:st.units.flatMap(uid=>U[uid].gens.map(g=>({g,u:uid}))), stage:st, mix:st.units});
}
function startExam(){
  const st = findStage(s=>s.type==='exam');
  app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button><h2>${st.title}</h2>
  <div class="card"><p>收錄課本「嚴選會考題」<span class="badge hk">會考題</span>，以及麻辣練習題、總複習卷、會考模擬試題中的相關題目<span class="badge rel">相關試題</span>。分成三組，<b>每組全對</b>且在 <b>${CONFIG.EXAM_LIMIT_MIN} 分鐘內</b>完成才算過關。</p>
  <div class="opts">${EXAM_PARTS.map(k=>`<button class="opt" data-g="${k}"><b>${EXAM_GRP[k]}</b>　<span class="sub">${EXAM.filter(e=>e.grp===k).length} 題</span>　${isPassed('e1'+k)?'<span class="pass ok">✔ 過關</span>':''}</button>`).join('')}</div></div>`;
  window.scrollTo(0,0);
  document.getElementById('bk').onclick = home;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.g;
    const qs = EXAM.filter(e=>e.grp===g).map(e=>({q:e.q, opts:e.opts, ans:[e.a], exp:e.exp, tag:e.tag}));
    runQuiz({id:'e1'+g, title:'會考挑戰・'+EXAM_GRP[g], stage:st, fixed:qs, examFixed:true});
  });
}

function buildRound(cfg, n){
  const qs=[]; const seen=new Set(); let guard=0;
  const byUnit = {}; cfg.gens.forEach(x=>{ (byUnit[x.u]=byUnit[x.u]||[]).push(x.g); });
  const units = Object.keys(byUnit); let order = shuffle(units);
  while(qs.length<n && guard<800){ guard++;
    if(qs.length % units.length===0) order = shuffle(units);
    const uu = order[qs.length % units.length];
    const q = pick(byUnit[uu])(); if(!q) continue;
    const k = q.key || q.q; if(seen.has(k)) continue; seen.add(k); q.unit=uu; qs.push(q);
  }
  return shuffle(qs);
}
function startQuiz(cfg){ runQuiz(Object.assign({}, cfg, {fixed: buildRound(cfg, CONFIG.ROUND_N)})); }

function sendRecord(rec){
  if(!CONFIG.GAS_URL) return;
  const queue = store.get('lt_queue', []); queue.push(rec); store.set('lt_queue', queue);
  flushQueue();
}
function flushQueue(){
  if(!CONFIG.GAS_URL) return;
  const queue = store.get('lt_queue', []); if(!queue.length) return;
  fetch(CONFIG.GAS_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({records:queue})})
    .then(()=>store.set('lt_queue', []))
    .catch(()=>{}); // 網路斷線時留在佇列，下次再送
}

function runQuiz(cfg){
  const qs = cfg.fixed; let i=0, score=0; const wrong=[]; const t0=Date.now();
  const limitMin = limitFor(cfg); const limitSec = limitMin*60;
  let timerId;
  function render(){
    clearInterval(timerId);
    const q = qs[i];
    const badge = q.tag==='hk' ? '<span class="badge hk">會考題</span>' : q.tag==='rel' ? '<span class="badge rel">相關試題</span>' : '';
    app.innerHTML = `<button class="back" id="bk">← 放棄這回，回地圖</button>
    <div class="qhead"><h2 style="margin:6px 0">${cfg.title}</h2><span class="timer" id="tm"></span></div>
    <div class="qhead"><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="sub">第 ${i+1} / ${qs.length} 題・答對 ${score}</span></div>
    <div class="card"><div class="qtext">${badge}${q.q}</div>
    <div class="opts ${q.cols?'cols':''}">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="lt">${LT[k]}</span>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <div class="toolbar" style="justify-content:flex-end"><button class="btn red hidden" id="nx">${i+1<qs.length?'下一題 →':'看結果'}</button></div></div>`;
    window.scrollTo(0,0);
    document.getElementById('bk').onclick = ()=>{ clearInterval(timerId); home(); };
    const tm = document.getElementById('tm');
    const tick=()=>{ const s=Math.floor((Date.now()-t0)/1000);
      if(cfg.redo){ tm.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; return; }
      const left = limitSec - s;
      if(left>=0){ tm.textContent=`⏳ 剩下 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; tm.className = 'timer'+(left<=60?' late':''); }
      else { tm.textContent=`⏰ 已超過 ${limitMin} 分鐘，這回不算過關（仍可繼續作答看詳解）`; tm.className='timer over'; } };
    tick(); timerId=setInterval(tick,1000);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  }
  function answer(k){
    const q = qs[i]; const ok = q.ans.includes(k);
    app.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(q.ans.includes(j)) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
    const fb = document.getElementById('fb');
    fb.className = 'fb '+(ok?'ok':'no');
    fb.innerHTML = (ok?'<b>✔ 答對了！</b> ':'<b>✘ 再想想：</b>正確答案是「'+q.ans.map(a=>q.opts[a]).join('」或「')+'」。<br>') + (q.exp||'');
    if(ok) score++; else wrong.push(q);
    const nx = document.getElementById('nx'); nx.classList.remove('hidden'); nx.focus();
    nx.onclick = ()=>{ i++; if(i<qs.length) render(); else finish(); };
  }
  function finish(){
    clearInterval(timerId);
    const secs = Math.max(1, Math.round((Date.now()-t0)/1000));
    const avg = Math.round(secs/qs.length*10)/10;
    const allCorrect = score===qs.length;
    const timeOK = secs <= limitSec;
    const official = !cfg.redo;               // 錯題再練不列入過關
    const passed = official && allCorrect && timeOK;
    if (official){
      const p = progress[cfg.id] || {tries:0, best:0, n:qs.length, passed:false};
      p.tries++; p.n=qs.length; p.best=Math.max(p.best, score);
      if(passed && !p.passed){ p.passed=true; p.passSecs=secs; p.passAt=new Date().toISOString(); }
      progress[cfg.id]=p; saveProg();
    }
    sendRecord({cls:student.cls, seat:student.seat, name:student.name, stage:cfg.id, stageName:cfg.title, mode: cfg.redo?'錯題再練':'正式',
      total:qs.length, correct:score, allCorrect, secs, avg, passed, minAvg:limitMin, limitMin});
    const nxt = cfg.stage ? nextStage(cfg.stage) : null;
    let msg;
    if (passed) msg = '<b class="ok-t">🎉 全對過關！</b>可以往下一關前進。';
    else if (!official) msg = allCorrect ? '錯題都會了！回到正式練習，全對才算過關。' : '還有不熟的，再看一次詳解吧。';
    else if (allCorrect && !timeOK) msg = `<b class="k">全對，但超過 ${limitMin} 分鐘了！</b><br>把重點記熟、不看講義，在時間內完成才算過關，再挑戰一次吧！`;
    else if (!timeOK) msg = `答對 ${score} 題，而且超過 ${limitMin} 分鐘。<b>要全對、在時間內完成才算過關</b>，先把錯題弄懂再挑戰！`;
    else msg = `答對 ${score} 題，<b>要全對才算過關</b>。先把錯題弄懂，再挑戰一回新題目！`;
    app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button><h2>${cfg.title}</h2>
    <div class="card result"><div class="score">${score} / ${qs.length}</div>
    <div class="bigpass ${passed?'ok':''}">${passed?'✔ 過關':'尚未過關'}</div>
    <p>${msg}<br><span class="sub">用時 ${fmtSec(secs)}（限時 ${limitMin} 分鐘）</span></p>
    <div class="toolbar" style="justify-content:center">
      ${wrong.length?'<button class="btn" id="redo">錯題再練一次（不計過關）</button>':''}
      <button class="btn red" id="again">${cfg.examFixed?'再挑戰一次':'再挑戰一回（新題目）'}</button>
      ${cfg.readUid?'<button class="btn ghost" id="reread">回去讀重點</button>':''}
      ${nxt && passed?'<button class="btn ghost" id="next">下一關 →</button>':''}
    </div>
    ${wrong.length?`<div class="wronglist"><h3>錯題整理</h3><ol>${wrong.map(q=>`<li>${stripBig(q.q)}<br><b class="k">答案：${q.ans.map(a=>q.opts[a]).join('／')}</b><br><span class="sub">${q.exp||''}</span></li>`).join('')}</ol></div>`:''}
    </div>`;
    window.scrollTo(0,0);
    document.getElementById('bk').onclick = home;
    const redo = document.getElementById('redo'); if(redo) redo.onclick = ()=>runQuiz(Object.assign({},cfg,{fixed:shuffle(wrong).map(q=>reshuffle(q)), title:cfg.title+'・錯題再練', redo:true}));
    const base = Object.assign({}, cfg, {redo:false, title: cfg.title.replace('・錯題再練','')});
    document.getElementById('again').onclick = ()=> base.gens ? startQuiz(base) : runQuiz(Object.assign(base,{fixed:base.examFixed?EXAM.filter(e=>'e1'+e.grp===base.id).map(e=>({q:e.q, opts:e.opts, ans:[e.a], exp:e.exp, tag:e.tag})):base.fixed}));
    const rr = document.getElementById('reread'); if(rr) rr.onclick = ()=>learn(cfg.readUid);
    const nb = document.getElementById('next'); if(nb) nb.onclick = ()=>{ if(nxt.type==='learn') learn(nxt.u); else if(nxt.type==='mix') startMix(nxt.id); else startExam(); };
  }
  render();
}
function limitFor(cfg){ return (cfg.examFixed || /^e1/.test(cfg.id)) ? CONFIG.EXAM_LIMIT_MIN : CONFIG.LIMIT_MIN; }
function reshuffle(q){ if(q.cols || q.opts.some(o=>/^\(/.test(o))) return q; const order = shuffle(q.opts.map((_,i)=>i)); return Object.assign({}, q, {opts:order.map(i=>q.opts[i]), ans:q.ans.map(a=>order.indexOf(a))}); }
function stripBig(html){ return html.replace(/<div class="(letter|note|invite|post|grid2|envs)[\s\S]*$/,'（見原題）').replace(/<br>/g,' '); }

// =========================================================
//                      老師端
// =========================================================
function teacherColumns(){
  const cols = [];
  allStages().forEach(st=>{
    if(st.type==='learn') cols.push({id:st.u, short:String(numbering[st.u]), name:stageName(st)});
    else if(st.type==='mix') cols.push({id:st.id, short:'合'+'①②③④⑤⑥⑦'[cols.filter(c=>c.short.startsWith('合')).length], name:st.title});
    else EXAM_PARTS.forEach((g,k)=>cols.push({id:'e1'+g, short:'考'+(k+1), name:'會考・'+EXAM_GRP[g]}));
  });
  return cols;
}
function teacher(){
  app.innerHTML = `<button class="back" id="bk">← 回學生登入</button><h2>老師端・過關總表</h2>
  <div class="card"><label>老師密碼 <input id="pin" type="password" style="width:140px"></label>
  <label style="margin-left:10px">班級 <input id="fcls" placeholder="全部" style="width:80px"></label>
  <span class="sub" style="margin-left:10px">過關標準：全對，且單元／合併 ${CONFIG.LIMIT_MIN} 分鐘內、會考每組 ${CONFIG.EXAM_LIMIT_MIN} 分鐘內完成</span>
  <button class="btn red small" id="load">讀取成績</button>
  <div id="tmsg" class="sub" style="margin-top:6px">${CONFIG.GAS_URL?'':'⚠ 尚未在程式最上方設定 GAS_URL，無法讀取成績。'}</div></div>
  <div id="tout"></div>`;
  document.getElementById('bk').onclick = ()=> student ? home() : login();
  document.getElementById('load').onclick = loadTeacher;
}
function loadTeacher(){
  const msg = document.getElementById('tmsg');
  if(!CONFIG.GAS_URL){ msg.textContent='⚠ 尚未設定 GAS_URL。'; return; }
  msg.textContent = '讀取中…';
  const pin = document.getElementById('pin').value;
  const urlNote = `<br>目前程式裡的 GAS_URL：<code style="word-break:break-all">${CONFIG.GAS_URL}</code>`;
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^?]+\/exec$/.test(CONFIG.GAS_URL)){
    msg.innerHTML = '⚠ GAS_URL 的網址格式不對：應該是 https://script.google.com/macros/s/……/exec，後面不加任何東西。' + urlNote; return; }
  fetch(CONFIG.GAS_URL + '?pin=' + encodeURIComponent(pin)).then(r=>r.text()).then(t=>{
    let d; try{ d = JSON.parse(t); }catch(e){ msg.innerHTML = '⚠ Google 回傳的不是成績資料。請到 Apps Script「管理部署作業」確認：誰可以存取＝所有人，並已部署新版本。' + urlNote; return; }
    if(d.error){ msg.textContent = '⚠ '+d.error; return; }
    msg.textContent = `共 ${d.rows.length} 筆作答紀錄・更新時間 ${new Date().toLocaleString()}`;
    renderTeacher(d.rows);
  }).catch(e=>{ msg.textContent = '⚠ 讀取失敗：'+e; });
}
function renderTeacher(rows){
  const fcls = document.getElementById('fcls').value.trim();
  const lim = id => (/^e1/.test(id) ? CONFIG.EXAM_LIMIT_MIN : CONFIG.LIMIT_MIN) * 60;
  const cols = teacherColumns();
  const S = {};
  rows.filter(r=>r.mode!=='錯題再練').forEach(r=>{
    const key = r.cls+'-'+r.seat; if(fcls && String(r.cls)!==fcls) return;
    const s = S[key] = S[key] || {cls:r.cls, seat:+r.seat, name:r.name, st:{}};
    s.name = r.name;
    const c = s.st[r.stage] = s.st[r.stage] || {tries:0, best:0, pass:null, fastAll:0, n:r.total};
    c.tries++; c.best = Math.max(c.best, +r.correct); c.n = r.total;
    const allC = +r.correct === +r.total;
    if(allC && +r.secs > lim(r.stage)) c.fastAll++;
    if(allC && +r.secs <= lim(r.stage) && !c.pass) c.pass = {secs:+r.secs, avg:+r.avg, tries:c.tries, t:r.t};
  });
  const list = Object.values(S).sort((a,b)=> String(a.cls).localeCompare(String(b.cls)) || a.seat-b.seat);
  if(!list.length){ document.getElementById('tout').innerHTML='<div class="card">目前沒有紀錄。</div>'; return; }
  let h = `<div class="card legend2"><b>圖例：</b><span class="cell ok">✔ 2:15</span> 全對過關（括號內第幾回才過）
  <span class="cell bad">8/10 ×3</span> 尚未過關（最佳成績・練了幾回）
  <span class="cell fast">⏰</span> 曾經全對但超時（不算過關，可能邊看講義邊作答）・滑鼠停在格子上可看詳情</div>
  <div class="tscroll"><table class="tt"><tr><th>班級</th><th>座號</th><th>姓名</th><th>過關數</th>${cols.map(c=>`<th title="${c.name}">${c.short}</th>`).join('')}</tr>`;
  list.forEach(s=>{
    const passN = cols.filter(c=>s.st[c.id]&&s.st[c.id].pass).length;
    h += `<tr><td>${s.cls}</td><td>${s.seat}</td><td>${s.name}</td><td><b>${passN}</b>/${cols.length}</td>`;
    cols.forEach(c=>{
      const x = s.st[c.id];
      if(!x){ h+='<td class="cell"></td>'; return; }
      const fast = x.fastAll ? '⏰' : '';
      if(x.pass) h += `<td class="cell ok" title="${c.name}｜第 ${x.pass.tries} 回過關｜用時 ${fmtSec(x.pass.secs)}｜共練 ${x.tries} 回${x.fastAll?'｜另有 '+x.fastAll+' 次全對但超時':''}">✔ ${Math.floor(x.pass.secs/60)}:${String(x.pass.secs%60).padStart(2,'0')}${x.pass.tries>1?`<small>(${x.pass.tries})</small>`:''}${fast}</td>`;
      else h += `<td class="cell ${x.fastAll?'fast':'bad'}" title="${c.name}｜最佳 ${x.best}/${x.n}｜共練 ${x.tries} 回${x.fastAll?'｜'+x.fastAll+' 次全對但超時':''}">${x.best}/${x.n} ×${x.tries}${fast}</td>`;
    });
    h += '</tr>';
  });
  h += `</table></div><div class="card sub">欄位代號：${cols.map(c=>`<b>${c.short}</b>＝${c.name}`).join('；')}<br>完整逐筆紀錄（含時間戳記、錯題再練）在 Google 試算表「紀錄」工作表，可直接篩選、排序或下載。</div>`;
  document.getElementById('tout').innerHTML = h;
}

flushQueue();
if(student) loadStudent();
home();
</script>
